spring:
  application:
    name: flexbook-engine

  datasource:
    url: ${FLEXBOOK_DB_URL:jdbc:postgresql://localhost:5432/flexbook}
    username: ${FLEXBOOK_DB_USER:flexbook}
    password: ${FLEXBOOK_DB_PASS:flexbook}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.flexbook: INFO
    org.hibernate.SQL: WARN
